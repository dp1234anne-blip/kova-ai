<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kova</title>
  <style>
    :root {
      --vvh: 100dvh;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: var(--vvh, 100dvh);
      overflow-x: hidden;
    }

    .kova-app {
      min-height: var(--vvh, 100dvh);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      gap: 12px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .kova-feed {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kova-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .kova-composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .kova-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .kova-input-row input,
    .kova-input-row textarea,
    .kova-input-field {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      outline: none;
    }

    .kova-input-row button,
    .kova-send-btn {
      flex-shrink: 0;
      white-space: nowrap;
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="kova-app">
    <div class="kova-feed" id="kovaFeed">
      <div class="kova-card">
        <strong>Kova</strong>
        <p style="color: var(--muted); margin-top: 4px;">
          Kova is ready. Type a prompt below to test mobile input layout and send behavior.
        </p>
      </div>
    </div>

    <div class="kova-composer">
      <div class="kova-input-row">
        <input
          id="kovaPromptInput"
          type="text"
          class="kova-input-field"
          placeholder="Ask Kova, upload/snap an image, voice chat..."
        />
        <button id="kovaSendBtn" type="button" class="kova-send-btn">Send</button>
      </div>
    </div>
  </div>

  <script>
    (function syncKovaViewport() {
      function updateVVH() {
        const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty("--vvh", `${Math.round(h)}px`);
      }
      updateVVH();
      window.addEventListener("resize", updateVVH);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateVVH);
        window.visualViewport.addEventListener("scroll", updateVVH);
      }
    })();

    (function wireBasicSendPreview() {
      const input = document.getElementById("kovaPromptInput");
      const btn = document.getElementById("kovaSendBtn");
      const feed = document.getElementById("kovaFeed");
      if (!input || !btn || !feed) return;

      function addCard(sender, text) {
        const card = document.createElement("div");
        card.className = "kova-card";
        const title = document.createElement("strong");
        title.textContent = sender;
        const body = document.createElement("p");
        body.style.marginTop = "4px";
        body.textContent = text;
        card.appendChild(title);
        card.appendChild(body);
        feed.appendChild(card);
        feed.scrollTop = feed.scrollHeight;
      }

      btn.addEventListener("click", () => {
        const val = input.value.trim();
        if (!val) return;
        addCard("You", val);
        input.value = "";
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          btn.click();
        }
      });
    })();
  </script>
</body>
</html>
